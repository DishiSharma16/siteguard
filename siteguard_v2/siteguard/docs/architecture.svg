<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Helvetica,Arial,sans-serif">
  <rect width="1000" height="330" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">SiteGuard: See, Decide, Act</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
  <g font-size="14" text-anchor="middle">
    <rect x="20" y="110" width="120" height="90" rx="10" fill="#e8f0fe" stroke="#3b6fd4"/>
    <text x="80" y="150" font-weight="bold">USB camera</text><text x="80" y="172" font-size="12">live / video file</text>

    <rect x="180" y="70" width="270" height="170" rx="10" fill="#e6f6ea" stroke="#2e8b4a"/>
    <text x="315" y="95" font-weight="bold">PipeGen + DeepStream (SEE)</text>
    <text x="315" y="125" font-size="12">Requirement → Pipeline IR → Model</text>
    <text x="315" y="145" font-size="12">→ Compiler → Run</text>
    <text x="315" y="175" font-size="12">Person detector + tracker</text>
    <text x="315" y="195" font-size="12">TensorRT FP16 / INT8</text>
    <text x="315" y="220" font-size="12">JSON metadata + live overlay</text>

    <rect x="490" y="95" width="190" height="120" rx="10" fill="#fff4e0" stroke="#d98a00"/>
    <text x="585" y="125" font-weight="bold">Alert engine (DECIDE)</text>
    <text x="585" y="150" font-size="12">zone + dwell filter</text>
    <text x="585" y="170" font-size="12">ALERT / CLEAR state</text>
    <text x="585" y="190" font-size="12">incident_log.jsonl</text>

    <rect x="720" y="110" width="110" height="90" rx="10" fill="#f0e8fe" stroke="#7a4fd4"/>
    <text x="775" y="150" font-weight="bold">MQTT</text><text x="775" y="172" font-size="11">siteguard/alerts</text>

    <rect x="870" y="70" width="115" height="170" rx="10" fill="#fde8e8" stroke="#c0392b"/>
    <text x="927" y="100" font-weight="bold">ESP32 (ACT)</text>
    <text x="927" y="125" font-size="11">built with FirmGen</text>
    <text x="927" y="155" font-size="12">Red LED</text>
    <text x="927" y="175" font-size="12">Buzzer</text>
    <text x="927" y="205" font-size="11">UART + telemetry</text>
  </g>
  <g stroke="#444" stroke-width="2" marker-end="url(#a)">
    <line x1="140" y1="155" x2="178" y2="155"/><line x1="450" y1="155" x2="488" y2="155"/>
    <line x1="680" y1="155" x2="718" y2="155"/><line x1="830" y1="155" x2="868" y2="155"/>
  </g>
  <text x="500" y="290" text-anchor="middle" font-size="13" fill="#555">Bonuses: Edge Optimization (INT8 vs FP16) · Closed Loop (vision → MQTT → ESP32) · Live Intelligence (FirmGen telemetry)</text>
</svg>
